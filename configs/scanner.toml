# Futures inefficiency scanner: python -m scanner serve
# Watchlist, signal parameters, news scoring and alert delivery.
# See docs/market-scanner.md for what each number does.

[data]
range = "2y"                # daily history to load from Yahoo (1y, 2y, 5y, ...)
refresh_minutes = 15
alert_on_live_bar = true    # alert on the forming bar (marked provisional); false = settled bars only

[efficiency]
lag = 5                     # VR(q): q-day vs 1-day variance
window = 500                # daily returns in the test
z_threshold = 1.96

[mean_reversion]
lookback = 20
entry_z = 2.0

[continuation]
channel = 20

[record]
horizon_days = 5
atr_days = 20

[news]
refresh_minutes = 10
google_news = true
feeds = [
  "https://farmdocdaily.illinois.edu/feed",
]
min_score = 4
max_age_hours = 36
impact_terms = [
  "USDA", "WASDE", "crop progress", "EPA", "RVO", "mandate", "tariff", "export ban",
  "export tax", "quota", "embargo", "sanctions", "drought", "frost", "freeze", "flood",
  "heat wave", "hurricane", "El Nino", "La Nina", "strike", "outbreak", "disease",
  "record", "surge", "plunge", "soar", "slump", "shortage", "glut", "CFTC", "subsidy",
]
up_words = ["surge", "soar", "jump", "rally", "rise", "gain", "climb", "higher", "tight", "shortage", "strong demand"]
down_words = ["plunge", "slump", "drop", "fall", "slide", "sink", "lower", "glut", "surplus", "weak demand"]

[alerts]
webhook_url = ""            # e.g. "https://ntfy.sh/<a-long-random-topic>" or a Slack/Discord webhook
webhook_format = "ntfy"     # json | ntfy | slack | discord

